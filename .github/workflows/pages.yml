# Publishes the Inkwell guide to GitHub Pages.
#
# The guide is a single self-contained page at the repo root, which is also what
# a branch-based Pages build serves, so there is only ever one copy of it.
#
# This workflow is only used when Settings → Pages → Source is "GitHub Actions".
# With the default "Deploy from a branch" the root index.html and .nojekyll are
# published directly and this never runs — both routes serve the same file.

name: Deploy the guide to Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp public/manifest.webmanifest _site/manifest.webmanifest
          # Pages runs Jekyll unless told not to; this page is already finished.
          touch _site/.nojekyll

      - name: Check the page is self-contained
        run: |
          # The guide must render with the network unplugged, so nothing may be
          # *loaded* from another host: no CDN fonts, scripts or images. Ordinary
          # <a href> links out are fine — those are navigation, not resources.
          if grep -Eq '(<script[^>]+src|<img[^>]+src|<link[^>]+href|@import|url\()\s*=?\s*["'"'"']?https?://' _site/index.html; then
            echo "The guide loads something from another host:"
            grep -En '(<script[^>]+src|<img[^>]+src|<link[^>]+href|@import|url\()\s*=?\s*["'"'"']?https?://' _site/index.html
            exit 1
          fi
          test -s _site/index.html
          echo "Guide is self-contained ($(wc -c < _site/index.html) bytes)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
